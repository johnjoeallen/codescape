name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B verify

      - name: Package
        run: mvn -B package -DskipTests

      - name: Assemble release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAGE="staging/codescape-${VERSION}"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/config"

          cp dist/bin/* "$STAGE/bin/"
          chmod +x "$STAGE/bin/codescape-service" "$STAGE/bin/codescape-mcp"
          cp dist/config/application.yml "$STAGE/config/"

          cp codescape-service/target/codescape-service-*.jar "$STAGE/lib/"
          cp codescape-mcp/target/codescape-mcp-*.jar "$STAGE/lib/"

          cp LICENSE README.md AGENTS.md INSTALL.md "$STAGE/"

          (cd staging && zip -r "../codescape-${VERSION}.zip" "codescape-${VERSION}")
          sha256sum "codescape-${VERSION}.zip" > "codescape-${VERSION}.zip.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codescape-${{ steps.version.outputs.version }}.zip
            codescape-${{ steps.version.outputs.version }}.zip.sha256
          generate_release_notes: true
