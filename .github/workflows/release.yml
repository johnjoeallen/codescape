name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: mvn -B verify

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            codescape-service/target/codescape-service-*.jar
            codescape-mcp/target/codescape-mcp-*.jar

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft

  # Each platform gets its own zip with a jlink runtime built for that
  # platform — jlink can't cross-compile a runtime for a different OS/arch
  # from the JDK modules it's running on, so "one zip for everyone" (the
  # previous single ubuntu-latest job) only ever worked on Linux x64.
  package:
    needs: [build, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-13
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: jars

      - name: Assemble release archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$(pwd)/staging/codescape-${VERSION}"
          mkdir -p "$STAGE/bin" "$STAGE/lib" "$STAGE/config"

          cp dist/bin/* "$STAGE/bin/"
          chmod +x "$STAGE/bin/codescape-service" "$STAGE/bin/codescape-mcp"
          cp dist/config/application.yml "$STAGE/config/"

          # actions/upload-artifact preserves each glob's directory structure
          # relative to the repo root when the inputs don't share a common
          # parent (codescape-service/target/... vs codescape-mcp/target/...),
          # so the downloaded jars aren't flat under jars/ — find them instead
          # of assuming a path shape.
          cp "$(find jars -name 'codescape-service-*.jar')" "$STAGE/lib/"
          cp "$(find jars -name 'codescape-mcp-*.jar')" "$STAGE/lib/"

          cp LICENSE README.md AGENTS.md INSTALL.md "$STAGE/"

          # jdeps can't see deps nested under BOOT-INF/lib/ in a Spring Boot
          # fat jar, so explode both jars and point it at the real classpath.
          EXPLODE="$(mktemp -d)"
          mkdir -p "$EXPLODE/service" "$EXPLODE/mcp"
          (cd "$EXPLODE/service" && jar xf "$STAGE"/lib/codescape-service-*.jar)
          (cd "$EXPLODE/mcp" && jar xf "$STAGE"/lib/codescape-mcp-*.jar)
          CP="$(find "$EXPLODE" -name '*.jar' | paste -sd: -)"
          MODULES="$(jdeps -q --multi-release=25 --print-module-deps --ignore-missing-deps \
            --class-path "$CP" --recursive \
            "$EXPLODE/service/BOOT-INF/classes" "$EXPLODE/mcp")"
          # jdk.crypto.ec is required for TLS but loaded via SPI, so jdeps can't see it.
          jlink --add-modules "${MODULES},jdk.crypto.ec" \
            --output "$STAGE/runtime" \
            --strip-debug --no-header-files --no-man-pages --compress=2

          ARCHIVE="codescape-${VERSION}-${PLATFORM}.zip"
          (cd staging && zip -r "../${ARCHIVE}" "codescape-${VERSION}")
          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "codescape-${VERSION}-${PLATFORM}.zip" \
            "codescape-${VERSION}-${PLATFORM}.zip.sha256" \
            --clobber

  publish-release:
    needs: [create-release, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
