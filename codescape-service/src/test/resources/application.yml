codescape:
  home: ${java.io.tmpdir}/codescape-test-${random.uuid}

spring:
  datasource:
    url: jdbc:h2:mem:codescape-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # validate, not create-drop: tests should exercise the real Flyway
      # migration (db/migration/) too, not bypass it, so a bug in the
      # migration SQL itself would actually be caught here.
      ddl-auto: validate
